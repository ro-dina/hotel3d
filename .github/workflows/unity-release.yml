name: Deploy Unity WebGL to GitHub Pages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Unity zip
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tmp
          curl -L -o tmp/WebGLBuild.zip \
            https://github.com/ro-dina/hotel3d/releases/download/${{ github.event.release.tag_name }}/WebGLBuild.zip
          ls -lh tmp/WebGLBuild.zip

      - name: Prepare site content
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site/unity
          unzip -o tmp/WebGLBuild.zip -d site/unity
          # Normalize output to site/unity/WebGLBuild/** so URL is /unity/WebGLBuild/index.html
          if [ -f "site/unity/index.html" ] && [ ! -f "site/unity/WebGLBuild/index.html" ]; then
            mkdir -p site/unity/WebGLBuild
            # Move all extracted files into WebGLBuild
            shopt -s dotglob
            mv site/unity/* site/unity/WebGLBuild/ || true
            shopt -u dotglob
          fi
          rm -rf site/unity/__MACOSX || true
          touch site/.nojekyll
          ls -lah site/unity | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
