name: Extract Unity WebGL Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Download Unity zip
        run: |
          mkdir -p tmp
          curl -L -o tmp/WebGLBuild.zip \
            https://github.com/ro-dina/hotel3d/releases/download/${{ github.event.release.tag_name }}/WebGLBuild.zip

      - name: Unzip Unity build
        run: |
          rm -rf docs/unity
          mkdir -p docs/unity
          unzip -o tmp/WebGLBuild.zip -d docs/unity

      - name: Ensure on main branch
        run: |
          git checkout -B main

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/unity
          git commit -m "Extract Unity WebGL build ${{ github.event.release.tag_name }}" || echo "No changes"
          git push origin HEAD:main