name: Deploy Unity WebGL to GitHub Pages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Unity zip
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tmp
          curl -L -o tmp/WebGLBuild.zip \
            https://github.com/ro-dina/hotel3d/releases/download/${{ github.event.release.tag_name }}/WebGLBuild.zip
          ls -lh tmp/WebGLBuild.zip

      - name: Prepare site content
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site/unity
          unzip -o tmp/WebGLBuild.zip -d site/unity
          rm -rf site/unity/__MACOSX || true
          ls -lah site/unity | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4